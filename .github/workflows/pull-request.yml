name: Pull request

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: AE2 ${{ matrix.ae2-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ae2-version:
          - rv3-beta-977-GTNH
          - rv3-beta-1000-GTNH
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew --build-cache --info --stacktrace clean build -Pae2Version=${{ matrix.ae2-version }}
